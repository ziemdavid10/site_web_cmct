# Configuration Nginx du site CMCT (application React à plusieurs pages, sans serveur d'API)

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;      # ne pas afficher la version de Nginx
    charset utf-8;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Sonde de santé (HEALTHCHECK Docker, répartiteur de charge) ──
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Fichiers cachés et fichiers destinés à d'autres hébergeurs ──
    location ~ /\.      { deny all; access_log off; log_not_found off; }
    location = /_redirects { return 404; }

    # ── Fichiers générés par Vite : nom avec empreinte, cache d'un an ──
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Images, logos, polices : cache d'une semaine ──
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ── Pages : React Router gère les adresses, toute route inconnue renvoie index.html ──
    # index.html n'est jamais mis en cache pour que les mises à jour soient visibles tout de suite.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Pas de `$uri/` : un dossier de même nom qu'une page ne doit pas provoquer de redirection
        try_files $uri /index.html;
    }
}
