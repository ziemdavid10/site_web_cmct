# En-têtes de sécurité, inclus dans chaque bloc `location`
# (Nginx n'hérite pas des add_header du bloc parent dès qu'un bloc en définit).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Politique de sécurité du contenu : n'autorise que ce que le site utilise réellement.
#   - polices Google Fonts
#   - envoi du formulaire de contact via EmailJS
#   - lecture de vidéos YouTube dans les réalisations
#   - styles en ligne : nécessaires aux animations (framer-motion)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https://api.emailjs.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
