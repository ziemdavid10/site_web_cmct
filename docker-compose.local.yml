# Usage local uniquement : publie le site sur un port de votre machine.
# (docker-compose.yml ne publie aucun port, car sur Coolify c'est le proxy qui route le trafic.)
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:8080      (autre port : SITE_PORT=3000 devant la commande)

services:
  web:
    ports:
      - "${SITE_PORT:-8080}:8080"
